"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 700

format = """$username$hostname$directory$git_branch$git_status
$character"""
right_format = """$nodejs$golang$rust$python$package$docker_context$aws$gcloud$azure$kubernetes$terraform"""

[username]
show_always = true
format = "[$user ]($style)"
style_user = "bold green"
style_root = "bold red"

[hostname]
ssh_only = true
format = "[at $hostname](bold green) "

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold cyan"
read_only = " (ro)"
read_only_style = "bold red"
truncation_length = 4
truncate_to_repo = true

[git_branch]
format = "[on $branch]($style) "
style = "bold purple"

[git_status]
format = "[($all_status$ahead_behind)]($style) "
style = "bold red"
conflicted = "U${count} "
ahead = ">${count} "
behind = "<${count} "
diverged = "<>${count} "
untracked = "?${count} "
stashed = "H${count} "
modified = "M${count} "
staged = "A${count} "
renamed = "R${count} "
deleted = "D${count} "

# Vi mode is now shown separately via env_var.STARSHIP_VI_MODE (set in
# .zshrc's zle-keymap-select), so the character itself stays a plain "$"
# regardless of vi mode - only its color changes on command success/error.
[env_var.STARSHIP_VI_MODE]
variable = "STARSHIP_VI_MODE"
default = "INSERT"
format = "[$env_value]($style) "
style = "bold yellow"

[character]
success_symbol = "[\\$](bold green)"
error_symbol = "[\\$](bold red)"
vimcmd_symbol = "[vi\\$](bold green)"
vimcmd_replace_one_symbol = "[vi\\$](bold green)"
vimcmd_replace_symbol = "[vi\\$](bold green)"
vimcmd_visual_symbol = "[vi\\$](bold green)"

[nodejs]
format = "[node $version]($style) "
style = "bold green"

[golang]
format = "[go $version]($style) "
style = "bold cyan"

[rust]
format = "[rust $version]($style) "
style = "bold red"

[python]
format = "[python $version]($style) "
style = "bold yellow"

[package]
disabled = false
format = "[pkg $version]($style) "
style = "bold blue"

[docker_context]
format = "[docker $context]($style) "
style = "bold blue"

[aws]
format = "[aws $profile(\\($region\\))]($style) "
style = "bold yellow"

[gcloud]
format = "[gcloud $account(@$domain)(\\($project\\))]($style) "
style = "bold blue"

[azure]
disabled = false
format = "[azure(\\($subscription\\))]($style) "
style = "bold blue"

[kubernetes]
disabled = false
format = "[k8s $context( $namespace)]($style) "
style = "bold red"

[terraform]
disabled = false
format = "[tf $workspace]($style) "
style = "bold purple"
